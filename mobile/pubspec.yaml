name: kuyshim
description: Master the ancient art of the Dombra with real-time AI feedback.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  record: ^6.0.0
  flutter_audio_capture: ^1.1.6
  pitch_detector_dart: ^0.0.7
  dio: ^5.9.2
  permission_handler: ^12.0.1
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_svg: ^2.2.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/lessonImages/
    - assets/dombra_icon.svg
    - assets/dombra_icon_green.svg
    - assets/kui_maps/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/dombra_icon.png"
